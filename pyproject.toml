[project]
name = "stocks_infer"
version = "0.1.0"
description = "A reproducible, provider-neutral stock screening pipeline"
authors = [{ name = "Sumit Haswar", email = "sumithaswar@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["duckdb>=1.0,<2.0"]

[project.scripts]
stocks-infer = "stocks_infer.cli:main"

[tool.poetry]
packages = [{ include = "stocks_infer", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
